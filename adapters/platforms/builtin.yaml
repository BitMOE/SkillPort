platforms:
  - key: claude-code
    displayName: Claude Code
    enabled: true
    supportedOS: [macos, windows, linux]
    skills:
      user:
        defaultPath: "~/.claude/skills"
        canOverride: true
      project:
        defaultPath: "<project>/.claude/skills"
        canOverride: true
    rules:
      - scope: project
        path: "<project>/CLAUDE.md"
        type: file
        mergeStrategies: [section_merge, append_block]
      - scope: project
        path: "<project>/.claude/CLAUDE.md"
        type: file
        mergeStrategies: [section_merge]
    install:
      defaultMode: symlink
      allowSymlink: true
      fallbackMode: copy
    scan:
      enabled: true
      patterns: ["**/SKILL.md"]

  - key: cursor
    displayName: Cursor
    enabled: true
    supportedOS: [macos, windows, linux]
    skills:
      user:
        defaultPath: ".cursor/skills"
        canOverride: true
      project:
        defaultPath: "<project>/.cursor/skills"
        canOverride: true
    rules:
      - scope: project
        path: "<project>/.cursor/rules"
        type: directory
        mergeStrategies: [replace, section_merge]
      - scope: project
        path: "<project>/.cursorrules"
        type: file
        mergeStrategies: [section_merge]
    install:
      defaultMode: copy
      allowSymlink: true
      fallbackMode: copy
    scan:
      enabled: true
      patterns: ["**/SKILL.md"]

