name: Release Packages

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MSI and portable packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find release -maxdepth 1 -type f \( -name "*.msi" -o -name "*.exe" -o -name "latest*.yml" \) | sort -u)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows release assets found."
            exit 1
          fi
          printf 'Uploading Windows asset: %s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-macos:
    name: Build macOS packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG, ZIP, and tar.gz packages
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find release -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz" -o -name "latest*.yml" -o -name "*-mac.yml" \) | sort -u)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No macOS release assets found."
            exit 1
          fi
          printf 'Uploading macOS asset: %s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
