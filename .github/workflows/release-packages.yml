name: Release Packages

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MSI and portable packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.msi release/*.exe release/latest*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Windows release assets found."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-macos:
    name: Build macOS packages
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG, ZIP, and tar.gz packages
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS assets to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/*.tar.gz release/latest*.yml release/*-mac.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No macOS release assets found."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
